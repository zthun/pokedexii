services:
  # Load Balancer (Entry Point)
  pokedexii.local.zthunworks.com:
    image: zthun/bouncer
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./.config:/.config
    depends_on:
      - pokedex-services-api
      - pokedex-services-web

  # Node Ports
  pokedex-services-web:
    image: node:lts
    volumes:
      - .:/usr/dev
    working_dir: /usr/dev
    command: yarn workspace @zthun/pokedex-web run start
  pokedex-services-api:
    image: node:lts
    ports:
      - 9229:9229
    volumes:
      - .:/usr/dev
    working_dir: /usr/dev
    command: yarn workspace @zthun/pokedex-api run debug
    depends_on:
      - pokedex-mongo
  # Databases
  pokedex-mongo:
    image: mongo:noble
    volumes:
      - pokedex-mongo-data:/data/db
  pokedex-mongo-express:
    image: mongo-express:latest
    ports:
      - 8081:8081
    depends_on:
      - pokedex-mongo
    environment:
      - ME_CONFIG_MONGODB_SERVER=pokedex-mongo
volumes:
  pokedex-mongo-data:
